name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - name: build
            run: go build -v ./cmd/sloff
          - name: fix
            run: go fix -v ./...
          - name: fmt-go
            run: go tool gofumpt -l -w -- .
          - name: lint
            run: go vet -v ./...
          - name: tidy
            run: go mod tidy
          - name: gen
            run: go tool buf generate && go tool gofumpt -l -w -- .
      fail-fast: false
    permissions:
      contents: read
    name: ${{ matrix.command.name }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: ${{ matrix.command.name }}
      run: ${{ matrix.command.run }}
    - name: Check for uncommitted changes
      run: git diff --exit-code

  test:
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Strip generated proto code from coverage profile
        run: |
          grep -v '^github.com/izumin5210/sloff/internal/proto/' coverage.out > coverage.filtered
          mv coverage.filtered coverage.out
      - uses: k1LoW/octocov-action@v1

  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Get buf version
        run: echo "version=$(go tool buf --version)" >> "$GITHUB_OUTPUT"
        id: buf-version
      - uses: bufbuild/buf-action@v1.4.0
        with:
          version: ${{ steps.buf-version.outputs.version }}
          push: false
          exclude_paths: testdata

  status-check:
    runs-on: ubuntu-latest
    needs:
      - check
      - test
      - buf
    permissions: {}
    if: failure()
    steps:
      - run: exit 1

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - name: build
            run: go build -v ./cmd/lazygen
          - name: test
            run: go test -v ./...
      fail-fast: false
    permissions:
      contents: read
    name: ${{ matrix.command.name }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: test
      run: go test -v ./...

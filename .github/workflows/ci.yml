name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - name: build
            run: go build -v ./cmd/sloff
          - name: fix
            run: go fix -v ./...
          - name: fmt-go
            run: go tool gofumpt -l -w -- .
          - name: lint
            run: go vet -v ./...
          - name: tidy
            run: go mod tidy
          - name: gen
            run: go tool buf generate
      fail-fast: false
    permissions:
      contents: read
    name: ${{ matrix.command.name }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26'
    - name: ${{ matrix.command.name }}
      run: ${{ matrix.command.run }}
    - name: Check for uncommitted changes
      run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      # -short excludes the network e2e (TestE2E_RealPnpm), which runs in its
      # own job below: its downloads and pnpm installs are heavy enough to
      # starve the kumo emulator's 60s startup budget in fingerprint/dynamodb
      # when both share one runner.
      - run: go test -v -race -short -coverprofile=coverage.out -covermode=atomic ./...
      - name: Strip generated proto code from coverage profile
        run: |
          grep -v '^github.com/izumin5210/sloff/internal/proto/' coverage.out > coverage.filtered
          mv coverage.filtered coverage.out
      - uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1

  test-pnpm-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      - run: go test -v -race -run 'TestE2E_RealPnpm' ./internal/sloff/toolresolver/pnpmlocal/

  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      - name: Get buf version
        run: echo "version=$(go tool buf --version)" >> "$GITHUB_OUTPUT"
        id: buf-version
      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: ${{ steps.buf-version.outputs.version }}
          push: false
          breaking: ${{ !contains(github.event.pull_request.title, '!:') }}

  status-check:
    runs-on: ubuntu-latest
    needs:
      - check
      - test
      - test-pnpm-e2e
      - buf
    permissions: {}
    if: failure()
    steps:
      - run: exit 1

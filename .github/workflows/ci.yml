name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command:
          - name: build
            run: go build -v ./cmd/sloff
          - name: fix
            run: go fix -v ./...
          - name: fmt-go
            run: go tool gofumpt -l -w -- .
          - name: lint
            run: go vet -v ./...
          - name: tidy
            run: go mod tidy
          - name: gen
            run: go tool buf generate
      fail-fast: false
    permissions:
      contents: read
    name: ${{ matrix.command.name }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26'
    - name: ${{ matrix.command.name }}
      run: ${{ matrix.command.run }}
    - name: Check for uncommitted changes
      run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      - run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Strip generated proto code from coverage profile
        run: |
          grep -v '^github.com/izumin5210/sloff/internal/proto/' coverage.out > coverage.filtered
          mv coverage.filtered coverage.out
      - uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1

  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      - name: Get buf version
        run: echo "version=$(go tool buf --version)" >> "$GITHUB_OUTPUT"
        id: buf-version
      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: ${{ steps.buf-version.outputs.version }}
          push: false
          breaking: ${{ !contains(github.event.pull_request.title, '!:') }}

  bench:
    # Regression gate for the perf work the E2E goldens cannot see (they
    # assert correctness, never speed). Compares the PR head against its
    # merge-base on the same runner, interleaved in time, then gates with
    # internal/benchgate. Strategy: docs/adr/0021-benchmark-suite-and-regression-gate.md.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'
      - name: Add merge-base worktree
        # TEMPORARY CALIBRATION (revert before merge): compare HEAD against
        # itself so the observed deltas measure pure runner noise.
        run: git worktree add /tmp/bench-base HEAD
      - name: Run benchmarks (interleaved base/head)
        # Interleaving base/head rounds on one runner cancels slow drift
        # (thermal, noisy neighbours); sample counts must stay >= benchgate's
        # -min-count so the significance test has power. Benchmarks never run
        # under -race (timing distortion) — correctness stays in the test job.
        run: |
          for i in 1 2 3; do
            scripts/bench.sh macro /tmp/bench-base.txt /tmp/bench-base 2
            scripts/bench.sh macro /tmp/bench-head.txt . 2
          done
          for i in 1 2 3 4 5; do
            scripts/bench.sh micro /tmp/bench-base.txt /tmp/bench-base 1
            scripts/bench.sh micro /tmp/bench-head.txt . 1
          done
      - name: Gate
        run: go run ./internal/benchgate -base /tmp/bench-base.txt -head /tmp/bench-head.txt
      - name: Dump raw benchmark outputs
        if: always()
        run: tail -n +1 /tmp/bench-base.txt /tmp/bench-head.txt

  status-check:
    runs-on: ubuntu-latest
    needs:
      - check
      - test
      - buf
      - bench
    permissions: {}
    if: failure()
    steps:
      - run: exit 1

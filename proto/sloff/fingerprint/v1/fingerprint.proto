// Schema for the on-disk fingerprint produced by sloff per (spec, task, input_hash) tuple.
//
// SSoT for ADR-0009. Wire-incompatible changes require bumping the package
// version (sloff.fingerprint.v2). See
// ../../../../docs/adr/0009-fingerprint-binary-serialization.md.
//
// Design rules enforced here:
//   - No `map<,>` fields. Order-sensitive collections are `repeated <Entry>`
//     and the marshaller sorts deterministically before writing.
//   - schema_version is a closed enum so unknown / invalid versions cannot be
//     represented at the wire level.
//   - Sub-messages are top-level; the `sloff.fingerprint.v1` package qualifier
//     keeps names like Spec / Input / Output appropriately scoped.

syntax = "proto3";

package sloff.fingerprint.v1;

option go_package = "github.com/izumin5210/sloff/internal/proto/sloff/fingerprint/v1;fingerprintv1";

// Record is one fingerprint on disk. Lives at
// .sloff/fingerprints/<spec_relpath>/<task_id>/<YYYYMMDDHHMMSSsss>-<input_hash>.pb.
// The filename's timestamp prefix encodes the record's initial creation time
// (ADR-0010); no wall-clock field is carried in the wire format so that the
// bytes are a deterministic function of the input.
message Record {
  SchemaVersion schema_version = 1;
  Spec spec = 2;
  Input input = 3;
  Output output = 4;
  // Field number 5 is reserved for the removed `generated_at` field (ADR-0010
  // dropped it once the filename prefix took over the initial-creation-time
  // role).
  reserved 5;
  reserved "generated_at";
}

// SchemaVersion enumerates the schemas a Record may carry. Enum values match
// the on-disk version number. The YAML format used schema_version 1 before
// ADR-0009 and is intentionally absent here.
enum SchemaVersion {
  SCHEMA_VERSION_UNSPECIFIED = 0;
  // First protobuf-encoded schema. Introduced by ADR-0009. Superseded by V3
  // and intentionally retained as a closed enum value so legacy on-disk
  // records can be detected and rejected explicitly.
  SCHEMA_VERSION_V2 = 2;
  // Drops Record.generated_at; the filename's timestamp prefix replaces it
  // (ADR-0010).
  SCHEMA_VERSION_V3 = 3;
}

message Spec {
  string dir = 1;
  string task_id = 2;
  string cmd = 3;
}

// Input captures everything that contributes to the fingerprint key for one task.
// hash = sha256_concat(files_hash, cmd_hash, resolved_versions_hash).
message Input {
  string hash = 1;
  string files_hash = 2;
  string cmd_hash = 3;
  // Equals the sorted-concat-and-SHA256 of resolved_versions[*].version.
  // Replaces the previous "tools_hash" field. The term "tool" was inaccurate
  // because go-local and pnpm-local resolvers contribute transitive external
  // dependency pins through this same path, not just user-declared tools.
  string resolved_versions_hash = 4;
  // Per-entry detail of every logical version pin contributing to
  // resolved_versions_hash. Unifies what previous YAML schema kept in
  // input.components.tools_hash plus the parallel generator_version_snapshot.
  // Sorted by name ascending before marshal.
  repeated ResolvedVersion resolved_versions = 5;
}

message Output {
  string hash = 1;
  // Sorted by path ascending before marshal.
  repeated FileEntry files = 2;
}

message FileEntry {
  // Repo-root relative, slash-separated.
  string path = 1;
  // SHA-256 hex.
  string hash = 2;
}

// ResolvedVersion is one OS-neutral logical version pin returned by a
// Resolver. Covers user-declared tools (script resolver), transitive Go
// module pins (go-local), and transitive npm package pins (pnpm-local).
message ResolvedVersion {
  string name = 1;
  // Logical version string fed into Input.resolved_versions_hash.
  string version = 2;
  // Informational source identifier (e.g. "<bin> --version", "go.mod",
  // "pnpm-local:@org/my-codegen"). Not part of the hash.
  string source = 3;
}

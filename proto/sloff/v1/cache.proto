// Schema for the on-disk cache record produced by sloff per (spec, task, input_hash) tuple.
//
// SSoT for ADR-0009. Wire-incompatible changes require bumping the package version
// (sloff.v2). See ../../../docs/adr/0009-cache-record-binary-serialization.md.
//
// Design rules enforced here:
//   - No `map<,>` fields. Order-sensitive collections are `repeated <Entry>` and the
//     marshaller sorts deterministically before writing.
//   - schema_version is a closed enum so unknown / invalid versions cannot be
//     represented at the wire level.
//   - Sub-messages are nested under CacheRecord to avoid leaking broad names
//     (Spec / Input / Output) at the package level.

syntax = "proto3";

package sloff.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/izumin5210/sloff/internal/proto/sloff/v1;sloffv1";

// CacheRecord is one cache entry on disk. Lives at
// .sloff/cache/<spec_relpath>/<task_id>/<input_hash>.pb.
message CacheRecord {
  SchemaVersion schema_version = 1;

  Spec spec = 2;
  Input input = 3;
  Output output = 4;

  // Informational. Not part of cache identity. Drift alone does not trigger
  // a write per ADR-0009 §"byte stability の担保".
  google.protobuf.Timestamp generated_at = 5;

  // SchemaVersion enumerates the schemas a CacheRecord may carry.
  // Enum values match the on-disk version number. The YAML format used
  // schema_version 1 before ADR-0009 and is intentionally absent here.
  enum SchemaVersion {
    SCHEMA_VERSION_UNSPECIFIED = 0;
    // First protobuf-encoded schema. Introduced by ADR-0009.
    SCHEMA_VERSION_V2 = 2;
  }

  message Spec {
    string dir = 1;
    string task_id = 2;
    string cmd = 3;
  }

  // Input captures everything that contributes to the cache key for one task.
  // hash = sha256_concat(files_hash, cmd_hash, resolved_versions_hash).
  message Input {
    string hash = 1;
    string files_hash = 2;
    string cmd_hash = 3;
    // Equals the sorted-concat-and-SHA256 of resolved_versions[*].version.
    // Replaces the previous "tools_hash" field. The term "tool" was inaccurate
    // because go-local and pnpm-local resolvers contribute transitive external
    // dependency pins through this same path, not just user-declared tools.
    string resolved_versions_hash = 4;
    // Per-entry detail of every logical version pin contributing to
    // resolved_versions_hash. Unifies what was previously split between the
    // hash side ("tools_hash" inputs) and the informational side
    // ("generator_version_snapshot"). Sorted by name ascending before marshal.
    repeated ResolvedVersion resolved_versions = 5;

    // ResolvedVersion is one OS-neutral logical version pin returned by a
    // Resolver. Covers user-declared tools (script resolver), transitive Go
    // module pins (go-local), and transitive npm package pins (pnpm-local).
    message ResolvedVersion {
      string name = 1;
      // Logical version string fed into resolved_versions_hash.
      string version = 2;
      // Informational source identifier (e.g. "<bin> --version", "go.mod",
      // "pnpm-local:@org/my-codegen"). Not part of the hash.
      string source = 3;
    }
  }

  message Output {
    string hash = 1;
    // Sorted by path ascending before marshal.
    repeated FileEntry files = 2;
  }

  message FileEntry {
    // Repo-root relative, slash-separated.
    string path = 1;
    // SHA-256 hex.
    string hash = 2;
  }
}

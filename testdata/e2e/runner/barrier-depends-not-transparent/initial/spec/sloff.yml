tools:
  versioner:
    exec: ["sh", "-c", "echo v1.0.0"]
    extract: 'v[0-9]+\.[0-9]+\.[0-9]+'

commands:
  - name: producer
    cmd: ["sh", "-c", "cp seed.txt produced.txt"]
    inputs: ["seed.txt"]
    outputs: ["produced.txt"]
    tools: [versioner]
  - name: gen-all
    barrier: true
    depends:
      - task: producer
  # consumer actually reads produced.txt but only declares the barrier edge;
  # the run-time missing-deps check must demand the direct producer edge.
  - name: consumer
    cmd: ["sh", "-c", "cp produced.txt final.txt"]
    inputs: ["produced.txt"]
    outputs: ["final.txt"]
    tools: [versioner]
    depends:
      - task: gen-all

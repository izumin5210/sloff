tools:
  versioner:
    exec: ["sh", "-c", "echo v1.0.0"]
    extract: 'v[0-9]+\.[0-9]+\.[0-9]+'

commands:
  - name: gen-a
    cmd: ["sh", "-c", "exit 1"]
    inputs: ["seed.txt"]
    outputs: ["a-out.txt"]
    tools: [versioner]
  - name: gen-all
    barrier: true
    depends:
      - task: gen-a
  - name: barrier-consumer
    cmd: ["sh", "-c", "echo ok > c-out.txt"]
    inputs: ["seed.txt"]
    outputs: ["c-out.txt"]
    tools: [versioner]
    depends:
      - task: gen-all

tools:
  versioner:
    exec: ["sh", "-c", "echo v1.0.0"]
    extract: 'v[0-9]+\.[0-9]+\.[0-9]+'

commands:
  - name: gen-a
    cmd: ["sh", "-c", "cp seed.txt a-out.txt"]
    inputs: ["seed.txt"]
    outputs: ["a-out.txt"]
    tools: [versioner]
  - name: gen-b
    cmd: ["sh", "-c", "cp seed.txt b-out.txt"]
    inputs: ["seed.txt"]
    outputs: ["b-out.txt"]
    tools: [versioner]
  # The group aggregates its members via a depends pattern (ADR-0016), so new
  # gen-* tasks join the barrier without touching this entry. "gen-*" also
  # matches the group's own name; pattern expansion excludes self.
  - name: gen-all
    group: true
    depends:
      - {task: "gen-*"}
  - name: barrier-consumer
    cmd: ["sh", "-c", "test -f a-out.txt && test -f b-out.txt && echo ok > c-out.txt"]
    inputs: ["seed.txt"]
    outputs: ["c-out.txt"]
    tools: [versioner]
    depends:
      - task: gen-all
